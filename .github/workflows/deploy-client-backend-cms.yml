name: Deploy Client Backend CMS

on:
  push:
    branches:
      - main
    paths:
      - 'packages/core/**'
      - 'my-sonicjs-app/**'
      - '.github/workflows/deploy-client-backend-cms.yml'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Build core package
        run: npm run build:core

      - name: Ensure DNS record exists for employee-directory-backend.sonicjs.com
        run: |
          ZONE_ID=$(curl -s "https://api.cloudflare.com/client/v4/zones?name=sonicjs.com" \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" | python3 -c "import sys,json; print(json.load(sys.stdin)['result'][0]['id'])")
          HTTP=$(curl -s -o /dev/null -w "%{http_code}" -X POST \
            "https://api.cloudflare.com/client/v4/zones/${ZONE_ID}/dns_records" \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            -H "Content-Type: application/json" \
            -d '{"type":"AAAA","name":"employee-directory-backend","content":"100::","ttl":1,"proxied":true}')
          if [ "$HTTP" = "200" ] || [ "$HTTP" = "409" ]; then
            echo "DNS record ready (HTTP $HTTP)"
          else
            echo "⚠️  DNS record creation returned HTTP $HTTP — may need manual DNS entry in CF dashboard"
          fi
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

      - name: Apply D1 migrations
        run: cd my-sonicjs-app && npx wrangler d1 migrations apply DB --remote --config wrangler.client-backend.toml
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Deploy client backend CMS to Cloudflare Workers
        run: |
          cd my-sonicjs-app
          if ! OUTPUT=$(npx wrangler deploy --config wrangler.client-backend.toml 2>&1); then
            echo "$OUTPUT"
            # The token may lack Zone > Workers Routes > Edit permission — treat as warning
            # only when the worker upload itself succeeded.
            if echo "$OUTPUT" | grep -q "Uploaded sonicjs-client-backend" && \
               echo "$OUTPUT" | grep -q "No access to the specified resource"; then
              echo "⚠️  Worker uploaded successfully but route registration failed."
              echo "   Grant 'Zone > Workers Routes > Edit' on the CLOUDFLARE_API_TOKEN secret to fully resolve."
            else
              exit 1
            fi
          else
            echo "$OUTPUT"
          fi
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
