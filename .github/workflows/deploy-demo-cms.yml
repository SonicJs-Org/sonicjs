name: Deploy Demo CMS

on:
  push:
    branches:
      - main
    paths:
      - 'packages/core/**'
      - 'my-sonicjs-app/**'
      - '.github/workflows/deploy-demo-cms.yml'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Build core package
        run: npm run build:core

      - name: Apply D1 migrations
        run: cd my-sonicjs-app && npx wrangler d1 migrations apply DB --remote --config wrangler.demo.toml
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Deploy demo CMS to Cloudflare Workers
        run: cd my-sonicjs-app && npx wrangler deploy --config wrangler.demo.toml
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
