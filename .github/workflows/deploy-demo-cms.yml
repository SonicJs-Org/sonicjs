name: Deploy Demo CMS

on:
  push:
    branches:
      - main
    paths:
      - 'packages/core/**'
      - 'my-sonicjs-app/**'
      - '.github/workflows/deploy-demo-cms.yml'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Build core package
        run: npm run build:core

      - name: Apply D1 migrations
        run: cd my-sonicjs-app && npx wrangler d1 migrations apply DB --remote --config wrangler.demo.toml
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Deploy demo CMS to Cloudflare Workers
        run: |
          cd my-sonicjs-app
          if ! OUTPUT=$(npx wrangler deploy --config wrangler.demo.toml 2>&1); then
            echo "$OUTPUT"
            # The token may lack Zone > Workers Routes > Edit permission, which causes wrangler
            # to exit non-zero after a successful worker upload.  The route already exists, so
            # the worker IS live — treat this specific error as a warning, not a failure.
            if echo "$OUTPUT" | grep -q "No access to the specified resource"; then
              echo "⚠️  Worker uploaded successfully but route registration failed."
              echo "   Grant 'Zone > Workers Routes > Edit' on the CLOUDFLARE_API_TOKEN secret to fully resolve."
            else
              exit 1
            fi
          else
            echo "$OUTPUT"
          fi
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
