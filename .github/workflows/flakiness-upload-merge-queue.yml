# Secure Flakiness upload for merge-queue runs
#
# Problem: merge_group runs the workflow from the queued commit, so a malicious PR
# could add steps that exfiltrate FLAKINESS_ACCESS_TOKEN before the CLI runs.
#
# Solution: This workflow triggers on workflow_run completion, which runs the
# workflow definition from the default branch (main), not from the queued commit.
# The token is never exposed to untrusted code.
name: Flakiness Upload (Merge Queue)

on:
  workflow_run:
    workflows: ['PR Tests']
    types: [completed]

permissions:
  contents: read
  actions: read

jobs:
  upload:
    # Only run for merge_group events targeting main that completed (success or failure).
    # workflow_run.event tells us the trigger event of the original workflow.
    if: >
      github.event.workflow_run.event == 'merge_group' &&
      github.event.workflow_run.head_branch != null &&
      contains(github.event.workflow_run.head_branch, 'gh-readonly-queue/main/')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    continue-on-error: true
    steps:
      - name: Checkout trusted CLI runtime from main
        uses: actions/checkout@v4
        with:
          # Always use the default branch (main) for the CLI - this workflow
          # definition and checkout both come from main, never from the queued commit.
          ref: main
          persist-credentials: false
          fetch-depth: 1
          sparse-checkout: scripts/testing/flakiness-runtime
          sparse-checkout-cone-mode: true

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install pinned Flakiness CLI
        working-directory: scripts/testing/flakiness-runtime
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Download Flakiness report artifacts from triggering run
        uses: actions/download-artifact@v4
        with:
          pattern: flakiness-*-${{ github.event.workflow_run.id }}-*
          path: ${{ runner.temp }}/flakiness-artifacts
          merge-multiple: false
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload reports to Flakiness.io
        shell: bash
        env:
          FLAKINESS_ACCESS_TOKEN: ${{ secrets.FLAKINESS_ACCESS_TOKEN }}
          FLAKINESS_PROJECT: SonicJs/sonicjs
        run: |
          set -euo pipefail
          CLI="$GITHUB_WORKSPACE/scripts/testing/flakiness-runtime/node_modules/.bin/flakiness"
          if ! "$CLI" access --project "$FLAKINESS_PROJECT"; then
            echo "::error::Flakiness.io authentication denied for $FLAKINESS_PROJECT"
            exit 1
          fi

          ARTIFACTS="$RUNNER_TEMP/flakiness-artifacts"
          dirs=()
          if [ -d "$ARTIFACTS" ]; then
            while IFS= read -r -d '' link; do
              echo "::warning::Removing symlink from Flakiness artifacts"
              rm -- "$link"
            done < <(find "$ARTIFACTS" -type l -print0)
            while IFS= read -r -d '' report; do
              dirs+=("${report%/report.json}")
            done < <(find "$ARTIFACTS" -type f -name report.json -path '*/vendor/report.json' -print0)
          fi
          if [ "${#dirs[@]}" -eq 0 ]; then
            echo "::warning::No Flakiness reports found"
            exit 0
          fi

          OUTPUT="$RUNNER_TEMP/flakiness-upload.log"
          "$CLI" upload --project "$FLAKINESS_PROJECT" "${dirs[@]}" 2>&1 | tee "$OUTPUT"
          {
            echo "## Flakiness.io (Merge Queue)"
            echo
            grep -oE 'https://flakiness[.]io/[^[:space:][:cntrl:]]+' "$OUTPUT" | sort -u || true
          } >> "$GITHUB_STEP_SUMMARY"
