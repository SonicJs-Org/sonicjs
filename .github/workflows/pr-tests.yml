name: PR Tests

on:
  pull_request_target:
    branches: [main, v3]
  push:
    branches: [main, v3]

permissions:
  contents: read

jobs:
  authorize:
    runs-on: ubuntu-latest
    environment:
      name: ${{ github.event_name == 'pull_request_target' && github.event.pull_request.head.repo.full_name != github.repository && 'external' || 'internal' }}
    steps:
      - name: Authorize
        run: echo 'Workflow authorized; fork code never receives deployment secrets.'

  test:
    needs: authorize
    runs-on: ubuntu-latest
    timeout-minutes: 150
    env:
      # Approval does not make fork code trusted. Forks/Dependabot run the full suite locally.
      TRUSTED_PREVIEW: ${{ github.actor != 'dependabot[bot]' && (github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository) }}
      E2E_DISPOSABLE_TARGET: '1'
      E2E_PERSIST_DIR: ${{ runner.temp }}/sonicjs-e2e-state
      CI: 'true'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request_target' && github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
          fetch-depth: 1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          # Privileged pull_request_target caches must not be shared with untrusted code.
          cache: ${{ env.TRUSTED_PREVIEW == 'true' && 'npm' || '' }}

      - name: Install locked dependencies
        run: npm ci

      - name: Type check
        run: npm run type-check

      - name: Lint E2E skip patterns and tags
        run: |
          bash scripts/lint-e2e-no-skip.sh
          bash scripts/lint-e2e-tags.sh

      - name: Run unit tests with coverage
        run: npm run test:cov

      - name: Upload coverage to Codecov
        if: env.TRUSTED_PREVIEW == 'true'
        uses: codecov/codecov-action@v4
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./packages/core/coverage/coverage-final.json
          flags: unittests
          fail_ci_if_error: false

      - name: Build core package
        run: npm run build:core

      - name: Install matching Playwright browser and OS dependencies
        run: npx playwright install --with-deps chromium

      - name: Allocate run-owned D1 database
        if: env.TRUSTED_PREVIEW == 'true'
        id: database
        working-directory: my-sonicjs-app
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          NAME="sonicjs-e2e-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          npx wrangler d1 create "$NAME"
          DB_ID=$(npx wrangler d1 list --json | jq -er --arg name "$NAME" '.[] | select(.name == $name) | .uuid')
          test -n "$DB_ID"
          sed -i "s/database_id = \"[^\"]*\"/database_id = \"$DB_ID\"/; s/database_name = \"[^\"]*\"/database_name = \"$NAME\"/" wrangler.toml
          npx wrangler d1 migrations apply DB --remote

      - name: Allocate run-owned R2 bucket
        if: env.TRUSTED_PREVIEW == 'true'
        id: r2bucket
        working-directory: my-sonicjs-app
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          NAME="${{ steps.database.outputs.name }}-media"
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          npx wrangler r2 bucket create "$NAME"
          sed -i "s/bucket_name = \"sonicjs-ci-media\"/bucket_name = \"$NAME\"/" wrangler.toml

      - name: Allocate run-owned KV namespace
        if: env.TRUSTED_PREVIEW == 'true'
        id: kvnamespace
        working-directory: my-sonicjs-app
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          TITLE="${{ steps.database.outputs.name }}-cache"
          echo "title=$TITLE" >> "$GITHUB_OUTPUT"
          RESULT=$(npx wrangler kv namespace create "$TITLE" 2>&1)
          KV_ID=$(echo "$RESULT" | grep -oP '(?<=id = ")[^"]+')
          test -n "$KV_ID"
          echo "id=$KV_ID" >> "$GITHUB_OUTPUT"
          sed -i "s/id = \"a16f8246fc294d809c90b0fb2df6d363\"/id = \"$KV_ID\"/" wrangler.toml

      - name: Deploy run-owned Workers preview
        if: env.TRUSTED_PREVIEW == 'true'
        id: deploy
        working-directory: my-sonicjs-app
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          WORKER_NAME: ${{ steps.database.outputs.name }}
          E2E_RUN_KEY: ${{ github.run_id }}-${{ github.run_attempt }}-${{ github.sha }}
        run: |
          set -euo pipefail
          mkdir -p ../e2e-logs
          CHECKOUT_SHA=$(git rev-parse HEAD)
          npx wrangler deploy --name "$WORKER_NAME" --tag "$CHECKOUT_SHA" \
            --var "E2E_RUN_KEY:$E2E_RUN_KEY" \
            --var "E2E_BUILD_SHA:$CHECKOUT_SHA" \
            --var "E2E_RESOURCE_NAME:$WORKER_NAME" \
            2>&1 | tee ../e2e-logs/deploy.log
          PREVIEW_URL=$(grep -oE "https://${WORKER_NAME}\.[a-zA-Z0-9-]+\.workers\.dev" ../e2e-logs/deploy.log | sort -u)
          test -n "$PREVIEW_URL"
          echo "BASE_URL=$PREVIEW_URL" >> "$GITHUB_ENV"
          echo "E2E_RUN_KEY=$E2E_RUN_KEY" >> "$GITHUB_ENV"
          printf 'run_id=%s\nattempt=%s\ncheckout=%s\n' "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" "$CHECKOUT_SHA" > ../e2e-logs/build.txt

      - name: Prepare isolated local D1 for forks and Dependabot
        if: env.TRUSTED_PREVIEW != 'true'
        working-directory: my-sonicjs-app
        run: npx wrangler d1 migrations apply DB --local --persist-to "$E2E_PERSIST_DIR"

      - name: Deployment and authenticated application readiness
        if: env.TRUSTED_PREVIEW == 'true'
        timeout-minutes: 3
        run: |
          set -euo pipefail
          # Only a bounded safe GET is retried. Auth/schema/seed failures are not retried.
          curl --fail --silent --show-error --location --connect-timeout 5 --max-time 15 \
            --retry 8 --retry-delay 2 --retry-connrefused "$BASE_URL/auth/login" -o /dev/null
          # Verify the deployed build matches our checkout
          IDENTITY=$(curl --fail --silent --show-error \
            -H "X-E2E-Run-Key: $E2E_RUN_KEY" \
            "$BASE_URL/__e2e__/identity")
          DEPLOYED_SHA=$(echo "$IDENTITY" | jq -r '.sha')
          EXPECTED_SHA=$(git rev-parse HEAD)
          if [ "$DEPLOYED_SHA" != "$EXPECTED_SHA" ]; then
            echo "::error::Build identity mismatch: deployed=$DEPLOYED_SHA expected=$EXPECTED_SHA"
            exit 1
          fi
          echo "Build identity verified: $DEPLOYED_SHA"
          npx tsx scripts/e2e-readiness.ts

      - name: Run full E2E regression suite
        timeout-minutes: 140
        run: |
          set -euo pipefail
          mkdir -p e2e-logs
          npx playwright test --config=tests/playwright.config.ts 2>&1 | tee e2e-logs/playwright.log

      - name: Upload E2E reports, failed-attempt traces and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            playwright-report/
            test-results/
            e2e-logs/
          retention-days: 7
          if-no-files-found: warn

      - name: Clean run-owned R2 storage via preview handler
        if: always() && env.TRUSTED_PREVIEW == 'true' && steps.deploy.outcome == 'success'
        run: |
          curl --fail --silent --show-error -X DELETE \
            -H "X-E2E-Run-Key: $E2E_RUN_KEY" \
            "$BASE_URL/__e2e__/storage" || true

      - name: Delete run-owned Worker
        if: always() && env.TRUSTED_PREVIEW == 'true' && steps.deploy.outcome != 'skipped' && steps.database.outputs.name != ''
        working-directory: my-sonicjs-app
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          WORKER_NAME: ${{ steps.database.outputs.name }}
        run: npx wrangler delete "$WORKER_NAME" --force

      - name: Delete run-owned D1 database
        if: always() && env.TRUSTED_PREVIEW == 'true' && steps.database.outputs.name != ''
        working-directory: my-sonicjs-app
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          DB_NAME: ${{ steps.database.outputs.name }}
        run: npx wrangler d1 delete "$DB_NAME" --skip-confirmation

      - name: Delete run-owned R2 bucket
        if: always() && env.TRUSTED_PREVIEW == 'true' && steps.r2bucket.outputs.name != ''
        working-directory: my-sonicjs-app
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler r2 bucket delete "${{ steps.r2bucket.outputs.name }}"

      - name: Delete run-owned KV namespace
        if: always() && env.TRUSTED_PREVIEW == 'true' && steps.kvnamespace.outputs.id != ''
        working-directory: my-sonicjs-app
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler kv namespace delete --namespace-id="${{ steps.kvnamespace.outputs.id }}"
